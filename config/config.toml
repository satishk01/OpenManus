# ============================================================================
# OpenManus LLM Configuration
# ============================================================================
# This file configures the AI models used by OpenManus.
# Supports both Claude and Amazon Nova Pro models via AWS Bedrock.

# Direct API Configuration (Alternative to Bedrock)
#[llm]
#model = "claude-3-7-sonnet-20250219"       # The LLM model to use
#base_url = "https://api.anthropic.com/v1/" # API endpoint URL
#api_key = "YOUR_API_KEY"                   # Your API key
#max_tokens = 8192                          # Maximum number of tokens in the response
#temperature = 0.0                          # Controls randomness

# ============================================================================
# AWS Bedrock Configuration (Recommended)
# ============================================================================
# Supports multiple model types with automatic detection:
# - Claude Models: *.anthropic.claude-* 
# - Nova Pro Models: *.amazon.nova-*

[llm] # Current Active Configuration
api_type = "aws"                                        # Use AWS Bedrock
model = "us.anthropic.claude-3-7-sonnet-20250219-v1:0" # Claude 3.7 Sonnet (Default)
base_url = "bedrock-runtime.us-east-1.amazonaws.com"    # Bedrock endpoint (not used directly)
max_tokens = 8192                                       # Maximum response tokens
temperature = 1.0                                       # Claude works well with 1.0
api_key = "bear"                                        # Required field (not used for Bedrock)

# ============================================================================
# Alternative Model Configurations
# ============================================================================
# To switch models, replace the [llm] section above with one of these:

# Amazon Nova Pro Configuration
# [llm]
# api_type = "aws"
# model = "us.amazon.nova-pro-v1:0"                     # Nova Pro model
# base_url = "bedrock-runtime.us-east-1.amazonaws.com"
# max_tokens = 8192
# temperature = 0.7                                     # Nova Pro optimal temperature
# api_key = "bear"

# Claude 3.5 Sonnet v2 Configuration  
# [llm]
# api_type = "aws"
# model = "us.anthropic.claude-3-5-sonnet-v2:0"        # Claude 3.5 Sonnet v2
# base_url = "bedrock-runtime.us-east-1.amazonaws.com"
# max_tokens = 8192
# temperature = 1.0
# api_key = "bear"

# ============================================================================
# Model Selection Guide
# ============================================================================
# Claude Models:
#   - Best for: Complex reasoning, code generation, creative writing
#   - Temperature: 0.7-1.0 (higher for creativity)
#   - Pattern: *.anthropic.claude-*
#
# Nova Pro Models:
#   - Best for: Fast responses, cost-effective operations
#   - Temperature: 0.3-0.7 (lower for precision)
#   - Pattern: *.amazon.nova-*

# Optional configuration for specific LLM models
[llm.vision]
model = "claude-3-7-sonnet-20250219"       # The vision model to use
base_url = "https://api.anthropic.com/v1/" # API endpoint URL for vision model
api_key = "YOUR_API_KEY"                   # Your API key for vision model
max_tokens = 8192                          # Maximum number of tokens in the response
temperature = 0.0                          # Controls randomness for vision model

# MCP (Model Context Protocol) configuration
[mcp]
server_reference = "app.mcp.server" # default server module reference
